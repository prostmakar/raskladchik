# Выпуск версии: поднять номер в файле VERSION (и добавить notes/v<версия>.md) и отправить в main.
# Если релиза с такой версией ещё нет — собирает Раскладчик.exe и публикует релиз v<версия>.
name: release
on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
      - name: Версия
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"; echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "Релиз $TAG уже есть"; fi
      - name: Тесты
        if: steps.v.outputs.exists != '1'
        run: |
          node tests/test_calc.js
          node tests/test_dxf.js
      - name: Сборка
        if: steps.v.outputs.exists != '1'
        run: python3 build.py
      - name: Релиз
        if: steps.v.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p "rel/Раскладчик"
          cp "dist/Раскладчик.exe" "Как пользоваться.txt" "rel/Раскладчик/"
          (cd rel && zip -qr "../Raskladchik_${TAG}.zip" "Раскладчик")
          cp "dist/Раскладчик.exe" Raskladchik.exe
          NOTES="notes/${TAG}.md"; [ -f "$NOTES" ] || echo "Раскладчик ${TAG}" > "$NOTES"
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "Раскладчик ${TAG}" --notes-file "$NOTES" Raskladchik.exe "Raskladchik_${TAG}.zip"
